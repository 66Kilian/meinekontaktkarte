<style>
  /* Marcellus (SIL Open Font License) – liegt auf unserem Server, kein Google-Abruf */
  @font-face{font-family:"Marcellus";src:url(fonts/marcellus-latin.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
  :root{
    /* Namen wie in lib/themes.js – ein gewähltes Kunden-Design überschreibt sie */
    --bg:#05090c;--card:#0d1b21;--line:rgba(244,238,228,.14);
    --text:#f6f0e6;--text-dim:#a9b6b5;--red:#ff6a1a;--orange:#ff6a1a;--gold:#e9bf6b;--gold-2:#fbe3a8;--lagoon:#38d9c8;
    --on-accent:#1a0d05;
    --serif:"Marcellus","Optima","Palatino Linotype",serif;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;background:var(--bg)}
  body{margin:0;min-height:100svh;background:transparent;color:var(--text);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
  ::selection{background:var(--gold);color:var(--on-accent)}
  img{display:block;max-width:100%;height:auto}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}

  /* Hintergrund: die Caribik-Bar, so weich, dass nur Licht und Farbe bleiben */
  .room{position:fixed;inset:-4%;z-index:-2;background:url(img/bg-blur.jpg) center/cover no-repeat;transform:scale(1.04)}
  .room::after{content:"";position:absolute;inset:0;background:
    radial-gradient(120% 75% at 50% 42%,rgba(5,9,12,.42) 0%,rgba(5,9,12,.72) 62%,rgba(5,9,12,.94) 100%)}

  main{width:100%;max-width:430px;flex:1;display:flex;flex-direction:column;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
  section.vcard{display:flex;flex-direction:column;gap:22px}

  /* Die Karte */
  .card{position:relative;overflow:hidden;isolation:isolate;color:var(--text);border-radius:24px;padding:34px 28px 26px;
    background:
      linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 38%),
      color-mix(in srgb,var(--card) 92%,transparent);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 24px 50px -24px rgba(0,0,0,.95),0 2px 0 rgba(255,255,255,.04) inset}
  /* Goldprägung: feiner Rahmen mit Verlauf */
  .card::before{content:"";position:absolute;inset:10px;border-radius:16px;padding:1px;pointer-events:none;
    background:linear-gradient(150deg,rgba(251,227,168,.7),rgba(233,191,107,.14) 30%,rgba(233,191,107,.08) 60%,rgba(251,227,168,.55));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
  /* Lichtstreif wie über einer Folienprägung */
  .card::after{content:"";position:absolute;inset:-40% -60%;z-index:2;pointer-events:none;
    background:linear-gradient(105deg,transparent 42%,rgba(255,240,205,.16) 48%,rgba(255,255,255,.28) 50%,rgba(255,240,205,.16) 52%,transparent 58%);
    transform:translateX(-70%);opacity:0}
  html.js .card.shine::after{animation:sheen 1.6s var(--ease) forwards}
  @keyframes sheen{0%{transform:translateX(-70%);opacity:1}100%{transform:translateX(70%);opacity:1}}

  .card .logo{width:min(78%,288px);margin:0 auto}
  .orn{display:flex;align-items:center;gap:14px;margin:22px 4px 20px;color:#e3283c}
  .orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(233,191,107,.45))}
  .orn::after{background:linear-gradient(270deg,transparent,rgba(233,191,107,.45))}
  .orn svg{width:46px;height:10px;flex:none}
  .card h1{margin:0;text-align:center;font:400 clamp(27px,7.6vw,33px)/1.08 var(--serif);letter-spacing:.01em;color:var(--text)}
  .card .what{margin:10px 0 0;text-align:center;font:400 12.5px/1.4 var(--serif);letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}

  .card dl{margin:26px 0 0;display:grid}
  .card .r{display:grid;grid-template-columns:24px 1fr;gap:14px;align-items:center;padding:13px 4px;border-top:1px solid rgba(255,255,255,.08)}
  .card .r svg{width:20px;height:20px;color:var(--gold)}
  .card dt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .card dd{margin:0;font-size:15.5px;line-height:1.45;color:#e9e3d8;overflow-wrap:anywhere}
  .card dd a{display:block;text-decoration:none}
  .card dd a:hover{color:#fff}

  .actions{display:grid;gap:10px}
  .btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:16px;
    font:600 16px/1 var(--font);letter-spacing:.01em;text-decoration:none;border:1px solid transparent;transition:transform .15s,filter .2s,background .2s,border-color .2s}
  .btn:active{transform:scale(.985)}
  .btn svg{width:20px;height:20px;flex:none}
  .btn-main{color:var(--on-accent);background:linear-gradient(180deg,#ff8a3d,var(--orange) 55%,#e9520c);
    box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 12px 24px -14px rgba(0,0,0,.9)}
  .btn-main:hover{filter:brightness(1.06)}
  .btn-line{color:var(--text);background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.14)}
  .btn-line:hover{border-color:rgba(255,255,255,.3)}
  .btn-site{min-height:48px;color:var(--gold-2);font:400 15px/1 var(--serif);letter-spacing:.14em;text-transform:uppercase}
  .btn-site svg{width:16px;height:16px}
  .btn-site:hover{color:#fff}

  /* Auftritt */
  html.js .card{animation:rise 1.1s var(--ease) both}
  html.js .actions{animation:fade .9s .4s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:perspective(900px) rotateX(14deg) translateY(30px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){html.js .card,html.js .actions{animation:none}html.js .card.shine::after{animation:none}}

  @media(max-height:700px){
    main{padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:14px}
    section.vcard{gap:14px}.card{padding:24px 22px 18px}.card::before{inset:7px}
    .card .logo{width:min(54%,210px)}.orn{margin:10px 4px}
    .card h1{font-size:23px;letter-spacing:0}.card .what{font-size:11px;letter-spacing:.16em;margin-top:6px}
    .card dl{margin-top:14px}.card .r{padding:8px 4px}.card dd{font-size:15px}
    .actions{gap:8px}.btn{min-height:50px}.btn-site{min-height:42px}
  }
</style>

<script>
/* Lichtstreif über die Karte: einmal nach dem Auftritt, danach bei Berührung */
(function(){
  var c = document.getElementById("card"); if(!c) return;
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  function shine(){ c.classList.remove("shine"); void c.offsetWidth; c.classList.add("shine"); }
  setTimeout(shine, 900);
  c.addEventListener("pointerdown", function(e){ if(!e.target.closest("a")) shine(); });
})();
</script>
