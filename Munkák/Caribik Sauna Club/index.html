<style>
  :root{
    /* Namen wie in lib/themes.js – ein gewähltes Kunden-Design überschreibt sie */
    --bg:#05090c;--bg-2:#0c1a20;--card:#0e1d23;--line:rgba(244,238,228,.16);
    --text:#f4eee4;--text-dim:#a9b6b5;--red:#ff6a1a;--orange:#ff6a1a;--gold:#f6b54a;--lagoon:#2ad6c5;
    --ink:#f4eee4;--ink-dim:#9fb0ae;--on-accent:#1a0d05;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;background:var(--bg)}
  body{margin:0;min-height:100svh;background:var(--bg);color:var(--text);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
  ::selection{background:var(--orange);color:var(--on-accent)}
  img{display:block;max-width:100%;height:auto}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}

  /* Nacht über der Lagune: ein einziger warmer Horizont, kein Dekor */
  .sky{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      linear-gradient(180deg,var(--bg) 0%,var(--bg) 46%,color-mix(in srgb,var(--lagoon) 9%,var(--bg)) 78%,color-mix(in srgb,var(--orange) 16%,var(--bg)) 100%)}

  header.top{width:100%;max-width:440px;display:flex;justify-content:flex-end;padding:calc(12px + env(safe-area-inset-top,0px)) 20px 0}
  .langbox{position:relative}
  #langBtn{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text-dim);font:600 13px var(--font);letter-spacing:.06em;cursor:pointer}
  #langPanel{position:absolute;right:0;top:42px;z-index:5;min-width:170px;padding:6px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);box-shadow:0 18px 36px -12px rgba(0,0,0,.7);display:none}
  #langPanel.open{display:block}
  #langPanel button{display:flex;gap:10px;width:100%;padding:10px;border:0;border-radius:8px;background:none;color:var(--text);font:inherit;font-size:15px;cursor:pointer;text-align:left}
  #langPanel button:hover,#langPanel button[aria-current=true]{background:color-mix(in srgb,var(--text) 9%,transparent)}
  #langPanel .code{margin-left:auto;color:var(--text-dim);font-size:12px}

  main{width:100%;max-width:440px;flex:1;display:flex;flex-direction:column;justify-content:center;padding:10px 20px 20px}
  section.vcard{display:flex;flex-direction:column;gap:20px}

  /* Die Karte selbst: Format einer gedruckten Visitenkarte, hochkant */
  .card{position:relative;overflow:hidden;color:var(--ink);background:var(--card);border-radius:20px;padding:26px 24px 22px;
    border:1px solid color-mix(in srgb,var(--ink) 10%,transparent);
    box-shadow:0 14px 28px -18px rgba(0,0,0,.9);
    transform-origin:50% 100%}
  .card .logo{width:min(70%,260px);margin:2px auto 0}
  .card .rule{height:1px;margin:18px 0 16px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ink) 22%,transparent),transparent)}
  .card h1{margin:0;text-align:center;font-size:clamp(22px,6.4vw,27px);line-height:1.15;font-weight:700;letter-spacing:-.01em}
  .card .what{margin:6px 0 0;text-align:center;font-size:15px;color:var(--ink-dim)}
  .card dl{margin:18px 0 0;display:grid;gap:10px}
  .card .r{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start}
  .card .r svg{width:20px;height:20px;margin-top:1px;color:color-mix(in srgb,var(--orange) 85%,var(--ink))}
  .card dt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .card dd{margin:0;font-size:15.5px;line-height:1.45;overflow-wrap:anywhere}
  .card dd a{text-decoration:none}
  .card dd a:hover{text-decoration:underline}

  .actions{display:grid;gap:10px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 20px;border-radius:14px;font:650 16px/1 var(--font);letter-spacing:.01em;text-decoration:none;border:1.5px solid transparent;transition:transform .15s,background .2s,border-color .2s}
  .btn:active{transform:scale(.98)}
  .btn svg{width:20px;height:20px;flex:none}
  .btn-main{background:var(--orange);color:var(--on-accent)}
  .btn-main:hover{background:color-mix(in srgb,var(--orange) 88%,#fff)}
  .btn-line{border-color:var(--line);color:var(--text)}
  .btn-line:hover{border-color:color-mix(in srgb,var(--text) 45%,transparent)}
  .btn-site{color:var(--lagoon);min-height:50px}
  .btn-site:hover{text-decoration:underline;text-underline-offset:.2em}

  footer{width:100%;max-width:520px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;padding:0 22px calc(18px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--text-dim)}
  footer a{text-decoration:none}
  footer a:hover{color:var(--text)}

  /* Auftritt: die Karte richtet sich einmal auf */
  html.js .card{animation:rise 1s var(--ease) both}
  html.js .actions{animation:fade .8s .35s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:perspective(900px) rotateX(16deg) translateY(28px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){html.js .card,html.js .actions{animation:none}}
  @media(min-height:820px){main{padding-bottom:6vh}}
  @media(max-height:700px){
    .card{padding:20px 20px 18px}.card .logo{width:min(56%,220px)}.card .rule{margin:12px 0}
    .card dl{margin-top:12px;gap:6px}.card dd{font-size:15px}section.vcard{gap:14px}.actions{gap:8px}
    .btn{min-height:50px}.btn-site{min-height:44px}header.top{padding-top:calc(8px + env(safe-area-inset-top,0px))}
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>

    <div id="langPanel" role="listbox"></div>

    <article class="card">
      <img class="logo" src="img/logo.png" alt="Caribik" width="600" height="354">

        <div class="r"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
          <dt>E-Mail</dt><dd><a href="mailto:office@caribik.at">office@caribik.at</a></dd></div>
        <div class="r"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
          <dt>Website</dt><dd><a href="https://www.caribik.at" target="_blank" rel="noopener">www.caribik.at</a></dd></div>

    <div class="actions">
      <a class="btn btn-main" href="caribik.vcf" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg><span data-i18n="save">Kontakt speichern</span></a>
      <a class="btn btn-line" href="mailto:office@caribik.at"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg><span data-i18n="mail">Per E-Mail kontaktieren</span></a>
      <a class="btn btn-site" href="https://www.caribik.at" target="_blank" rel="noopener"><span data-i18n="site">Zur Website caribik.at</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></a>
    </div>

</footer>

<script src="i18n.js" defer></script>
<script>
document.addEventListener("DOMContentLoaded", function(){
  var T = window.I18N || {};
  var LANGS = [["de","Deutsch"],["en","English"],["hu","Magyar"],["sk","Slovenčina"],["cs","Čeština"]];
  var DE = {};
  document.querySelectorAll("[data-i18n]").forEach(function(el){ var k = el.getAttribute("data-i18n"); if(!(k in DE)) DE[k] = el.innerHTML; });
  var cur = "de";
  function tx(k){ var d = cur === "de" ? DE : (T[cur] || DE); return d[k] != null ? d[k] : DE[k]; }
  var langBtn = document.getElementById("langBtn"), langPanel = document.getElementById("langPanel");
  LANGS.forEach(function(l){
    var b = document.createElement("button");
    b.type = "button"; b.setAttribute("role","option"); b.setAttribute("data-code", l[0]);
    b.innerHTML = "<span>"+l[1]+"</span><span class=\"code\">"+l[0].toUpperCase()+"</span>";
    b.addEventListener("click", function(){ apply(l[0]); langPanel.classList.remove("open"); langBtn.setAttribute("aria-expanded","false"); });
    langPanel.appendChild(b);
  });
  langBtn.addEventListener("click", function(e){ e.stopPropagation(); var o = langPanel.classList.toggle("open"); langBtn.setAttribute("aria-expanded", o ? "true" : "false"); });
  document.addEventListener("click", function(e){ if(!langPanel.contains(e.target)) langPanel.classList.remove("open"); });
  function apply(code){
    cur = (code === "de" || T[code]) ? code : "de";
    document.querySelectorAll("[data-i18n]").forEach(function(el){ var v = tx(el.getAttribute("data-i18n")); if(v != null) el.innerHTML = v; });
    document.documentElement.setAttribute("lang", cur);
    document.getElementById("langCode").textContent = cur.toUpperCase();
    langPanel.querySelectorAll("button").forEach(function(b){ b.setAttribute("aria-current", b.getAttribute("data-code") === cur ? "true" : "false"); });
    try{ localStorage.setItem("cb_lang", cur); }catch(e){}
  }
  var initial = "de";
  try{ var s = localStorage.getItem("cb_lang"); if(s && T[s]) initial = s; }catch(e){}
  if(initial === "de"){ var nav = (navigator.language || "de").slice(0,2); if(T[nav]) initial = nav; }
  apply(initial);
});
</script>
